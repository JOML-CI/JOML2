name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all modules
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 17 compiles joml2-records-jdk17, 28-ea compiles joml2-value (JEP 401 preview).
      # Gradle itself runs on 27, the last one listed: setup-gradle injects Groovy init
      # scripts, and Gradle's Groovy cannot read the class files of an early-access JDK.
      - name: Set up Temurin 17, 28-ea and 27
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            28-ea
            27

      # Caches dependencies, the wrapper and the build cache; the configuration cache
      # is saved only when the GRADLE_ENCRYPTION_KEY secret is set.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # A 5g daemon keeps the four-worker build at ~12 GB on the 16 GB runner.
      - name: Build
        run: >-
          ./gradlew build
          -Pvalhalla.jdk.home="$JAVA_HOME_28_X64"
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          -Dorg.gradle.jvmargs="-Dfile.encoding=UTF-8 -Xmx5g"
