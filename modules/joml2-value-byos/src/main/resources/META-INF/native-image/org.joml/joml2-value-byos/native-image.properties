# GraalVM native-image configuration for joml2-value-byos.
#
# Generated by the JOML build (buildSrc/NativeImageMetadata.kt) - do not edit
# in place; a rebuild overwrites it.
#
# The SIMD cells pick their vector shape from the running machine at class
# initialization: denied build-time initialization, so an image takes the
# shape of the machine it runs on.
Args = --initialize-at-run-time=org.joml2.internal.opssimd
