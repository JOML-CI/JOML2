# GraalVM native-image configuration for joml2-fields.
#
# Generated by the JOML build (buildSrc/NativeImageMetadata.kt) - do not edit
# in place; a rebuild overwrites it.
#
# Keeps the library's runtime -Djoml.* flags working and its Unsafe-derived
# offsets host-correct by denying build-time initialization to the classes
# that read them.
Args = --initialize-at-run-time=org.joml2.Joml,org.joml2.Math,org.joml2.Math$Cfg,org.joml2.JomlConfig,org.joml2.internal.unsafe,org.joml2.internal.storeload
